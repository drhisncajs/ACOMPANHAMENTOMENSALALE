<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Painel de Conteúdo — Espaço Flor de Lótus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--vinho:#54172D;--bordo:#7A3048;--ouro:#C5A15D;--ouro-claro:#E9D9B8;--bg:#FAF7F1;--bg2:#F1EAE1;--tx:#34252B;--card:#fff;--head:#54172D;--btn:#54172D;--line:rgba(84,23,45,.13);--mute:rgba(52,37,43,.68);--sh:0 1px 2px rgba(84,23,45,.06),0 6px 18px rgba(84,23,45,.06);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1D0E15;--bg2:#2A1620;--tx:#F1EAE1;--card:#33202A;--head:#E9D9B8;--btn:#7A3048;--line:rgba(233,217,184,.16);--mute:rgba(241,234,225,.7);--sh:0 1px 2px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#1D0E15;--bg2:#2A1620;--tx:#F1EAE1;--card:#33202A;--head:#E9D9B8;--btn:#7A3048;--line:rgba(233,217,184,.16);--mute:rgba(241,234,225,.7);--sh:0 1px 2px rgba(0,0,0,.3)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:400 17px/1.6 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;color:var(--head);margin:0;line-height:1.15;font-weight:600}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:grid;grid-template-columns:280px 1fr;min-height:100vh}
.side{background:var(--vinho);color:#FAF7F1;position:sticky;top:0;height:100vh;padding:32px 20px;display:flex;flex-direction:column;gap:32px}
.brand{display:flex;gap:12px;align-items:center}
.brand svg{width:38px;height:38px;stroke:var(--ouro);stroke-width:1.3}
.brand b{display:block;font:600 19px/1.15 'Cormorant Garamond',serif;letter-spacing:.14em}
.brand span{font-size:14px;color:var(--ouro-claro)}
.plan{font-size:14px;color:var(--ouro-claro);border-top:1px solid rgba(233,217,184,.25);padding-top:16px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:14px;background:none;border:0;border-radius:12px;padding:13px 14px;text-align:left;color:#F1EAE1;transition:background .3s,color .3s;position:relative}
.nav button:hover{background:rgba(250,247,241,.09)}
.nav button.on{background:rgba(250,247,241,.14);color:#fff}
.nav button.on::before{content:"";position:absolute;left:-20px;top:12px;bottom:12px;width:3px;border-radius:3px;background:var(--ouro)}
.nav svg{stroke:var(--ouro)}
.sync{margin-top:auto;font-size:14px;color:var(--ouro-claro);display:flex;gap:8px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--ouro)}
.top{display:none}
main{padding:48px 56px 80px;max-width:1120px;width:100%}
.pg-h{margin-bottom:32px}
.pg-h h1{font-size:clamp(2rem,4vw,2.75rem)}
.pg-h p{margin:8px 0 0;color:var(--mute);max-width:62ch}
.kick{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--bordo);font-weight:600;margin:0 0 16px}
:root[data-theme="dark"] .kick{color:var(--ouro)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .kick{color:var(--ouro)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.stat{padding:20px;text-align:left;transition:transform .3s,box-shadow .3s;display:flex;flex-direction:column;gap:4px}
.stat:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(84,23,45,.1)}
.stat svg{stroke:var(--ouro);margin-bottom:8px}
.stat b{font:600 44px/1 'Cormorant Garamond',serif;color:var(--head)}
.stat span{font-size:15px}
.stat small{font-size:14px;color:var(--mute)}
.prog{padding:24px;margin-bottom:48px}
.prog-top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.prog-top b{font:600 40px/1 'Cormorant Garamond',serif;color:var(--head)}
.bar{height:10px;border-radius:10px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ouro);border-radius:10px;transition:width .6s cubic-bezier(.2,.7,.2,1)}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px;font-size:14px;color:var(--mute)}
.mini .bar{height:6px;margin-top:6px}
.up{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.up .card{padding:20px;display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.date{font:600 14px/1 Figtree;letter-spacing:.06em;color:var(--vinho);background:var(--ouro-claro);padding:6px 10px;border-radius:8px}
.chan{font-size:14px;color:var(--mute)}
.up h3,.pn h3{font-size:24px}
.obj{margin:0;font-size:15px;color:var(--mute)}
.badge{font-size:14px;font-weight:600;padding:4px 12px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);white-space:nowrap}
.badge.s1{background:var(--ouro-claro);border-color:var(--ouro);color:var(--vinho)}
.badge.s2{background:var(--vinho);border-color:var(--vinho);color:#FAF7F1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;border:1px solid var(--btn);background:var(--btn);color:#FAF7F1;font-weight:600;font-size:16px;transition:transform .3s,background .3s,box-shadow .3s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(84,23,45,.2)}
.btn.ghost{background:transparent;color:var(--head);border-color:var(--ouro)}
.btn.ghost:hover{background:var(--ouro-claro);color:var(--vinho)}
.btn.sm{padding:8px 14px;font-size:15px}
.btn svg{width:18px;height:18px}
.up .btn{align-self:flex-start;margin-top:8px}
.lay{display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
.dates{display:flex;flex-direction:column;gap:8px;position:sticky;top:24px}
.dt{display:flex;gap:12px;align-items:center;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;text-align:left;transition:border-color .3s,background .3s}
.dt:hover{border-color:var(--ouro)}
.dt.on{border-color:var(--bordo);background:var(--bg2)}
.dt b{font-size:16px;min-width:46px;color:var(--head)}
.dt span{font-size:15px;line-height:1.3;flex:1}
.dot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--ouro);flex:none}
.dot.s1{background:var(--ouro)}.dot.s2{background:var(--vinho);border-color:var(--vinho)}
.pn{padding:28px}
.pn h2{font-size:clamp(1.7rem,3vw,2.2rem);margin:12px 0}
.meta{display:flex;flex-direction:column;gap:12px;margin:16px 0 24px}
.meta p{margin:0}
.meta strong{color:var(--head)}
.vis{background:var(--bg2);border-left:3px solid var(--ouro);border-radius:10px;padding:14px 16px;font-size:16px}
.acts{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:var(--card);border:0;padding:10px 14px;font-size:15px;transition:background .3s}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ouro-claro);color:var(--vinho);font-weight:600}
.sts{display:flex;flex-direction:column;gap:12px}
.st{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--bg)}
.st-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.st-h b{font-size:15px;letter-spacing:.08em;color:var(--bordo);text-transform:uppercase}
:root[data-theme="dark"] .st-h b{color:var(--ouro)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .st-h b{color:var(--ouro)}}
.txt{white-space:pre-wrap;margin:0}
mark{background:var(--ouro-claro);color:var(--vinho);border-radius:4px;padding:0 4px}
.acc{margin-bottom:12px;overflow:hidden}
.acc-h{width:100%;display:flex;align-items:center;gap:12px;padding:18px 20px;background:none;border:0;text-align:left;flex-wrap:wrap}
.acc-h .tt{flex:1;min-width:200px;font:600 22px/1.2 'Cormorant Garamond',serif;color:var(--head)}
.acc-h .ch{transition:transform .3s}
.acc.open .ch{transform:rotate(180deg)}
.acc-b{display:none;padding:4px 20px 24px;border-top:1px solid var(--line)}
.acc.open .acc-b{display:block}
.kv{display:flex;gap:24px;flex-wrap:wrap;margin:16px 0}
.kv p{margin:0}.kv strong{color:var(--head)}
.sub{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:24px 0 10px;font-weight:600}
.chk{display:flex;gap:12px;align-items:center;padding:10px 0;cursor:pointer;font-size:16px}
.chk input{width:22px;height:22px;accent-color:var(--vinho);flex:none;cursor:pointer}
.tags{color:var(--bordo);font-weight:500;margin-top:12px}
.pil{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:20px 0}
.pil div{padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--bg)}
.pil b{display:block;color:var(--head);font:600 22px 'Cormorant Garamond',serif}
.pil span{font-size:15px;color:var(--mute)}
.vipo{background:var(--vinho);color:#FAF7F1;border-radius:18px;padding:24px;margin-bottom:32px}
.vipo h3{color:var(--ouro-claro);font-size:26px;margin-bottom:8px;letter-spacing:.04em}
.vipo p{margin:4px 0}
.goal{padding:24px;margin-bottom:32px}
.goal p{margin:0}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translate(-50%,20px);background:var(--vinho);color:#FAF7F1;border:1px solid var(--ouro);padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:all .35s;z-index:50;font-weight:500}
.toast.on{opacity:1;transform:translate(-50%,0)}
.bot{display:none}
@media (max-width:900px){
.app{display:block}.side{display:none}
.top{display:block;position:sticky;top:env(safe-area-inset-top,0px);background:var(--vinho);color:#FAF7F1;padding:12px 20px;z-index:20}
.top b{display:block;font:600 17px/1.2 'Cormorant Garamond',serif;letter-spacing:.14em}.top span{font-size:14px;color:var(--ouro-claro)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--vinho);z-index:30}
main{padding:28px 16px 120px}
.stats{grid-template-columns:repeat(2,1fr)}.up{grid-template-columns:1fr}
.mini{grid-template-columns:repeat(2,1fr)}.pil{grid-template-columns:1fr}
.lay{grid-template-columns:1fr}
.dates{flex-direction:row;overflow-x:auto;position:static;padding-bottom:6px}
.dt{flex:none;min-width:190px}
.pn{padding:20px 16px}
.bot{display:flex;position:fixed;left:0;right:0;bottom:0;background:var(--vinho);padding:8px 4px calc(env(safe-area-inset-bottom,0px) + 8px);z-index:40}
.bot button{flex:1;background:none;border:0;color:var(--ouro-claro);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;padding:6px 0}
.bot button.on{color:#fff}.bot button.on svg{stroke:var(--ouro)}
.btn{width:100%}.acts .seg{width:100%}.seg button{flex:1}.up .btn{width:auto}
}
</style>
</head>

 <div class="stats">${grp.map((g,i)=>{const [n,d]=cnt(g[0]);return `<button class="card stat" data-a="nav" data-t="${T[i]}">${ico(T[i]==='stories'?'stories':T[i]==='vip'?'vip':T[i])}<b>${n}</b><span>${g[2]}</span><small>${d} de ${n} concluídas</small></button>`}).join('')}</div>
 <div class="card prog"><div class="prog-top"><div><p class="kick" style="margin:0 0 4px">Progresso geral</p><span>${done} de ${tot} atividades concluídas</span></div><b>${pc}%</b></div><div class="bar"><i style="width:${pc}%"></i></div>
 <div class="mini">${grp.map(g=>{const [n,d]=cnt(g[0]);return `<div>${g[0]} · ${d}/${n}<div class="bar"><i style="width:${d/n*100}%"></i></div></div>`}).join('')}</div></div>
 <p class="kick">PRÓXIMAS PUBLICAÇÕES</p>
 ${nx.length?`<div class="up">${nx.map(i=>`<div class="card"><div class="row"><span class="date">${i.dk===9999?'A confirmar':i.date}</span><span class="chan">${i.ch}</span>${badge(i.id)}</div><h3>${esc(i.title)}</h3>${i.obj?`<p class="obj"><strong>Objetivo:</strong> ${esc(i.obj)}</p>`:''}<button class="btn sm" data-a="go" data-t="${i.tab}" data-i="${i.id}">Ver conteúdo ${ico('arrow')}</button></div>`).join('')}</div>`:`<div class="card pn">Tudo publicado. Parabéns, Ale! 🪷</div>`}`}

function vStories(){
 const s=ST.find(x=>x.id===selS)||ST[0],st=stat(s.id);
 return `<div class="pg-h"><h1>Stories</h1><p>Escolha uma data para ver os textos prontos da sequência.</p></div>
 <div class="lay"><div class="dates">${ST.map(x=>`<button class="dt ${x.id===s.id?'on':''}" data-a="sel" data-i="${x.id}"><b>${x.date}</b><span>${esc(x.title)}</span><i class="dot s${stat(x.id)}"></i></button>`).join('')}</div>
 <div class="card pn" id="el-${s.id}"><div class="row"><span class="date">${s.date}</span>${badge(s.id)}</div><h2>${esc(s.title)}</h2>
 <div class="meta"><p><strong>Objetivo estratégico:</strong> ${esc(s.meta.OBJ)}</p><p><strong>Quantidade:</strong> ${s.blk.length} ${s.blk.length>1?'Stories':'Story'}</p><div class="vis"><strong>Orientação visual:</strong> ${esc(s.meta.VIS)}</div></div>
 <div class="acts">${cbtn('sa|'+s.id,'COPIAR TODOS OS STORIES')}<button class="btn ${st===2?'ghost':''}" data-a="stv" data-i="${s.id}" data-v="${st===2?0:2}">${ico('check')}${st===2?'Publicada — desfazer':'Marcar como publicada'}</button>
 <div class="seg">${SL.map((l,v)=>`<button class="${st===v?'on':''}" data-a="stv" data-i="${s.id}" data-v="${v}">${l}</button>`).join('')}</div></div>
 <div class="sts">${s.blk.map((b,j)=>{const [a,n]=b.label.split(' — ');return `<div class="st"><div class="st-h"><b>${a}${n?' · '+n:''}</b>${cbtn('s|'+s.id+'|'+j,'Copiar Story','ghost')}</div><p class="txt">${txt(b.text)}</p></div>`}).join('')}</div></div></div>`}

function vInsta(){
 return `<div class="pg-h"><h1>Posts do Instagram</h1><p>Quatro publicações. Abra um post para copiar os cards, a legenda e acompanhar o checklist.</p></div>
 ${IG.map(p=>`<div class="card acc ${openI===p.id?'open':''}" id="el-${p.id}"><button class="acc-h" data-a="oi" data-i="${p.id}"><span class="date">${p.date}</span><span class="tt">${p.num} — ${esc(p.title)}</span>${badge(p.id)}<span class="ch">${ico('chev')}</span></button>
 <div class="acc-b"><div class="kv"><p><strong>Data:</strong> ${p.date}/2026</p><p><strong>Formato:</strong> ${esc(p.meta.FMT)}</p></div><p><strong>Objetivo:</strong> ${esc(p.meta.OBJ)}</p>
 <div class="acts" style="margin-top:16px">${cbtn('ia|'+p.id,'Copiar todo o post')}</div>
 <p class="sub">Cards</p><div class="sts">${p.cards.map((b,j)=>`<div class="st"><div class="st-h"><b>${esc(b.label)}</b>${cbtn('ic|'+p.id+'|'+j,'Copiar card','ghost')}</div><p class="txt">${txt(b.text)}</p></div>`).join('')}</div>
 <p class="sub">Legenda e hashtags</p><div class="st"><div class="st-h"><b>Legenda</b>${cbtn('il|'+p.id,'Copiar legenda','ghost')}</div><p class="txt">${txt(p.cap)}</p><p class="tags">${esc(p.tags)}</p></div>
 <p class="sub">Checklist de publicação</p>${CK.map((c,j)=>`<label class="chk"><input type="checkbox" data-a="ck" data-k="ck:${p.id}:${j}" ${S['ck:'+p.id+':'+j]?'checked':''}>${c}</label>`).join('')}</div></div>`).join('')}`}

function vGoogle(){
 return `<div class="pg-h"><h1>Posts do Google</h1><p>Seção de acompanhamento: a publicação é realizada por Kely.</p></div>
 ${GG.map(p=>`<div class="card pn" id="el-${p.id}" style="margin-bottom:20px"><div class="row"><span class="date">${p.date}</span>${badge(p.id)}</div><h2>${p.num} — ${esc(p.title)}</h2>
 <p class="sub">Título da arte</p><p class="txt"><strong>${esc(p.blk[0].text)}</strong></p>
 <p class="sub">Texto principal da arte</p><p class="txt">${esc(p.blk[1].text)}</p>
 <p class="sub">Legenda completa</p><div class="st"><p class="txt">${esc(p.blk[2].text)}</p></div>
 <div class="acts" style="margin-top:16px">${cbtn('g|'+p.id,'Copiar legenda')}</div>
 <p class="obj"><strong>Status:</strong> Publicação realizada por Kely</p>
 <label class="chk"><input type="checkbox" data-a="stc" data-i="${p.id}" ${stat(p.id)===2?'checked':''}>Kely já publicou</label></div>`).join('')}`}

function vVip(){
 return `<div class="pg-h"><h1>Estratégia do Grupo VIP</h1><p>Nove ações, uma por data. Copie a mensagem, envie no grupo e marque como publicada.</p></div>
 <div class="card goal"><p class="kick">OBJETIVO DO GRUPO</p><p>Transformar o Grupo VIP em um espaço de relacionamento, informação e oportunidades exclusivas para as participantes.</p>
 <div class="pil"><div><b>Relacionamento</b><span>mensagens de acolhimento e proximidade.</span></div><div><b>Conteúdo</b><span>dicas de autocuidado e informações sobre os tratamentos.</span></div><div><b>Exclusividade</b><span>ofertas e condições especiais para as participantes.</span></div></div></div>
 <div class="vipo"><h3>OFERTA ESPECIAL VIP</h3><p>Limpeza de pele + retorno para revitalização em 15 dias.</p><p><strong>Investimento: R$ 250,00.</strong></p><p>Essa condição deve ser apresentada como uma experiência exclusiva, diferente da oferta pública de R$ 150,00.</p></div>
 ${VP.map(p=>`<div class="card acc ${openV===p.id?'open':''}" id="el-${p.id}"><button class="acc-h" data-a="ov" data-i="${p.id}"><span class="date">${p.date}</span><span class="tt">${esc(p.title)}</span>${badge(p.id)}<span class="ch">${ico('chev')}</span></button>
 <div class="acc-b"><p class="sub">Mensagem</p><div class="st"><p class="txt">${esc(p.blk[0].text)}</p></div>
 <div class="acts" style="margin-top:16px">${cbtn('v|'+p.id,'Copiar mensagem')}</div>
 <label class="chk"><input type="checkbox" data-a="stc" data-i="${p.id}" ${stat(p.id)===2?'checked':''}>Publicado no grupo</label></div></div>`).join('')}`}

function render(){
 const V={visao:vVisao,stories:vStories,instagram:vInsta,google:vGoogle,vip:vVip}[tab];
 $('#main').innerHTML=V();
 $('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" data-a="nav" data-t="${t[0]}">${ico(t[3])}${t[1]}</button>`).join('');
 $('#bot').innerHTML=TABS.map(t=>`<button class="${t[0]===tab?'on':''}" data-a="nav" data-t="${t[0]}">${ico(t[3])}${t[2]}</button>`).join('')}

function nav(t){tab=t;history.replaceState(null,'','#'+t);render();window.scrollTo(0,0)}
function go(t,i){tab=t;if(t==='stories')selS=i;if(t==='instagram')openI=i;if(t==='vip')openV=i;history.replaceState(null,'','#'+t);render();
 requestAnimationFrame(()=>{const e=document.getElementById('el-'+i);if(e)e.scrollIntoView({behavior:'smooth',block:'start'});else window.scrollTo(0,0)})}

document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.tagName==='INPUT')return;const d=el.dataset;
 switch(d.a){case 'nav':nav(d.t);break;case 'go':go(d.t,d.i);break;
 case 'sel':selS=d.i;render();break;
 case 'copy':copy(copyText(d.c));break;
 case 'stv':put('st:'+d.i,+d.v);break;
 case 'oi':openI=openI===d.i?null:d.i;render();break;
 case 'ov':openV=openV===d.i?null:d.i;render();break}});
document.addEventListener('change',e=>{const el=e.target;if(el.tagName!=='INPUT')return;const d=el.dataset;
 if(d.a==='ck')put(d.k,el.checked);if(d.a==='stc')put('st:'+d.i,el.checked?2:0)});

const h=location.hash.slice(1);if(TABS.some(t=>t[0]===h))tab=h;
loadLocal();render();setSync();initDb();
</script>
</body>
</html>
